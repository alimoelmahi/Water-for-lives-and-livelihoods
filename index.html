<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006eb5" />
    <meta name="description" content="End of life for GIS products. This dashboard is no longer active." />
    <title>Water for Lives &amp; Livelihoods | Sudan Impact Atlas</title>
    <link rel="icon" type="image/webp" href="images/image2.webp" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #232e3d; color: #fff; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .retirement-wall { position: fixed; inset: 0; overflow: auto; display: grid; place-items: center; padding: 32px 24px; }
      .retirement-notice { width: 100%; max-width: 640px; margin-block: auto; text-align: center; }
      .retirement-label { margin: 0 0 18px; color: #8cc6df; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); font-weight: 600; letter-spacing: -.04em; line-height: 1.15; }
      .retirement-description { margin: 20px 0 0; color: #d3dee8; font-size: 16px; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main class="retirement-wall" aria-labelledby="retirement-title">
      <div class="retirement-notice">
        <p class="retirement-label">Water for lives and livelihoods</p>
        <h1 id="retirement-title">End of life for GIS products</h1>
        <p class="retirement-description">This dashboard is no longer active. Map exploration and interactive features are unavailable.</p>
      </div>
    </main>
  </body>
</html>
